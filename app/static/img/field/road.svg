<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Full-Width Asphalt Base -->
  <rect width="128" height="128" fill="#4B4B4B"/>
  
  <!-- Dashed Center Divider Line (Centered at x=64) -->
  <line x1="64" y1="0" x2="64" y2="128" 
        stroke="#FFC800" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-dasharray="24 18"/>
</svg>
